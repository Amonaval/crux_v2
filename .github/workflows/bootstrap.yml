name: Build Crux v0.2 pilot

on:
  push:
    branches: [ main ]
    paths:
      - 'crux-play-pilot.zip'
      - 'patches/v0.2/**'
      - 'patches/v0.2-hotfix.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify uploaded project archive
        run: |
          test -f crux-play-pilot.zip
          echo "4bbe2ec03f38c6ba7f942e27d0b3697c5487dd0a4a93f1c810d461f705630e2a  crux-play-pilot.zip" | sha256sum -c -

      - name: Expand project and apply v0.2 patch
        run: |
          mkdir project
          unzip -q crux-play-pilot.zip -d project
          cat patches/v0.2/*.b64 | base64 -d > /tmp/crux-v02-patch.zip
          echo "5ae395371844d9e391f878ee7a627199445b24ee9d8b226a4a5be01c5f4dd65e  /tmp/crux-v02-patch.zip" | sha256sum -c -
          unzip -q -o /tmp/crux-v02-patch.zip -d project/crux-main
          base64 -d patches/v0.2-hotfix.b64 > /tmp/crux-v02-hotfix.zip
          echo "479c38c91613f61f70c09d4b513d35e9f1e5866061dd6de505b085bba377abfc  /tmp/crux-v02-hotfix.zip" | sha256sum -c -
          unzip -q -o /tmp/crux-v02-hotfix.zip -d project/crux-main
          cd project/crux-main
          chmod +x gradlew
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Run unit tests
        working-directory: project/crux-main
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: project/crux-main
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: project/crux-main
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crux-v02-debug-apk
          path: project/crux-main/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: crux-v02-release-aab-unsigned
          path: project/crux-main/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
