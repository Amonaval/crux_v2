name: Bootstrap Crux project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        run: |
          cat bootstrap/part-* > /tmp/crux.zip
          unzip -t /tmp/crux.zip
          mkdir -p /tmp/crux-unpacked
          unzip -q /tmp/crux.zip -d /tmp/crux-unpacked
          rsync -a /tmp/crux-unpacked/crux-main/ ./
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: crux-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Commit expanded source
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .github/workflows/build.yml
          git diff --cached --quiet || git commit -m "feat: expand Crux Android project"
          git push
