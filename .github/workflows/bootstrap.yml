name: Build uploaded Crux project

on:
  push:
    branches: [ main ]
    paths:
      - 'crux-play-pilot.zip'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify uploaded project archive
        run: |
          test -f crux-play-pilot.zip
          echo "4bbe2ec03f38c6ba7f942e27d0b3697c5487dd0a4a93f1c810d461f705630e2a  crux-play-pilot.zip" | sha256sum -c -

      - name: Expand project
        run: |
          mkdir project
          unzip -q crux-play-pilot.zip -d project
          cd project/crux-main
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Run unit tests
        working-directory: project/crux-main
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: project/crux-main
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: project/crux-main
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crux-debug-apk
          path: project/crux-main/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: crux-release-aab-unsigned
          path: project/crux-main/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
